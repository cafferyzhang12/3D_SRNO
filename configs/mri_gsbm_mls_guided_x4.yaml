mode: gsbm
run_dir: runs/mri/mri_x4_gsbm_mls_guided
data:
  kind: paired_mri_png
  degradation: paired_xy
  scale: 4
  patch_size:
  - 5
  - 128
  - 128
  channel_policy: identical_rgb_to_gray
  scan_workers: 4
  train:
    root_lq: data/MRI_SR/train/LQ/X4_png
    root_hq: data/MRI_SR/train/HQ_png
  val:
    root_lq: data/MRI_SR/val_small/LQ/X4_png
    root_hq: data/MRI_SR/val_small/HQ_png
  test:
    root_lq: data/MRI_SR/test/LQ/X4_png
    root_hq: data/MRI_SR/test/HQ_png
  scan_cache:
    train: reports/mri/gsbm_mls_x4/index_train.json
    val: reports/mri/gsbm_mls_x4/index_val.json
    test: reports/mri/gsbm_mls_x4/index_test.json
  legacy_scan_cache:
    train: data/private/scan_train.json
    val: data/private/scan_val.json
    test: data/private/scan_test.json
model:
  width: 16
representation:
  width: 24
  feature_dim: 64
  bank_samples: 4096
  checkpoint: null
path:
  knots: 5
  iterations: 5
  lr: 0.02
  quadrature: 5
  optimize_std: true
  std_bound: 0.75
  sigma: 0.1
  state_weight: 0.01
  metric_weight: 0.01
  control_weight: 1.0
  max_correction: 0.25
  geometry_ramp_power: 2.0
train:
  representation_epochs: 10
  bridge_epochs: 40
  epochs: 40
  batch_size: 4
  train_samples: 1
  val_samples: 1
  samples_per_epoch: 4096
  val_samples_per_epoch: 64
  learning_rate: 0.0001
  matching_time_min: 0.02
  workers: 2
  threads: 4
  seed: 42
  validate_every: 1
  metric_matching_weight: 0.05
sampling:
  steps: 20
  sigma: 0.1
  geometry_guidance:
    strength: 0.02
    start: 0.3
    max_update: 0.002
test:
  fraction: 0.15
  subset_seed: 20261110
  save_volume_limit: 8
atlas:
  charts: 48
  neighborhoods:
  - 48
  - 144
  - 384
  dim_candidates:
  - 3
  - 4
  - 6
  - 8
  mls:
    degree: 2
    neighbors: 128
    anchor_limit: 32
    ridge: 0.0001
  source_routing:
    candidates: 3
    normal_weight: 3.0
